{% extends "base.html" %}{% block content %}
<h1>Maintenance</h1><form method="get"><label>Location<select name="location_id" onchange="this.form.submit()">{% for l in locations %}<option value="{{l.id}}" {% if l.id==selected %}selected{% endif %}>{{l.name}}</option>{% endfor %}</select></label></form>
{% for m,t,last,p,d,level in status %}<article class="service {{level}}"><b>{{m.name}}</b> — {{t.name}}
<span>{% if last %}{{p if p is not none else "?"}} plays / {{d}} days since service{% else %}Never logged{% endif %}</span>
<form method="post"><input type="hidden" name="machine_id" value="{{m.id}}"><input type="hidden" name="service_type_id" value="{{t.id}}">
<input name="rep" placeholder="CDM rep" required><input name="cost" type="number" step="0.01" value="0"><input name="notes" placeholder="Notes"><button>Log</button></form></article>{% endfor %}
{% endblock %}
